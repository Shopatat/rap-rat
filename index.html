<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#060403">
<title>Rap Rat</title>
<meta name="description" content="Minuteur du jeu Rap Rat : un fromage que le rat croque petit à petit, jusqu'à ce qu'il n'en reste plus.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Rap Rat">
<meta name="format-detection" content="telephone=no">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="stage" id="stage">
  <canvas id="view" aria-label="Le fromage, qui se fait croquer au fil du temps"></canvas>
</div>
<div class="banner" id="banner" hidden></div>

<header id="header">
  <span class="mark">Rap Rat</span>
  <span class="sub">le fromage du rat</span>
</header>

<div class="bar" id="idleBar">
  <div class="row">
    <div class="stepper" role="group" aria-label="Durée de la partie">
      <button id="durMinus" type="button" aria-label="Moins de temps">−</button>
      <output id="durOut">15 min</output>
      <button id="durPlus" type="button" aria-label="Plus de temps">+</button>
    </div>
    <button class="btn" id="soundBtn" type="button" aria-pressed="true">Son : oui</button>
    <button class="btn" id="musicBtn" type="button" aria-pressed="true">Musique : thème</button>
  </div>
  <button class="btn primary wide" id="startBtn" type="button">C'est parti !</button>
  <span class="hint">Pendant la partie, touche l'écran pour faire apparaître la pause.</span>
</div>

<div class="bar overlay away" id="runBar" hidden>
  <div class="row">
    <button class="btn primary" id="pauseBtn" type="button">Pause</button>
    <button class="btn" id="restartBtn" type="button">Recommencer</button>
    <button class="btn" id="fsBtn" type="button" hidden>Plein écran</button>
  </div>
</div>

<div class="bar" id="endBar" hidden>
  <button class="btn primary wide" id="againBtn" type="button">Nouvelle partie</button>
</div>

<!-- en portrait, l'appli s'efface derrière ce panneau : le fromage n'est beau qu'en paysage -->
<div class="turn" id="turn">
  <svg viewBox="0 0 120 120" aria-hidden="true">
    <rect x="42" y="12" width="36" height="66" rx="7" fill="none" stroke="currentColor" stroke-width="4"/>
    <path d="M30 92a44 44 0 0 0 60 0" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
    <path d="M86 86l6 10-11 2z" fill="currentColor"/>
  </svg>
  <strong>Tourne ton téléphone</strong>
  <span>Rap Rat se joue en paysage : le fromage prend alors tout l'écran.</span>
</div>

<!-- La musique du jeu. Un <audio> plutôt que Web Audio : sur iPhone il tient mieux la veille
     et les allers-retours vers une autre appli. « loop » suffit — si elle se termine, elle repart.
     Pas de src ici : js/app.js met le morceau choisi (thème ou instrumental). -->
<audio id="music" loop preload="auto" playsinline></audio>

<script src="js/app.js"></script>
</body>
</html>
